[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-agent-nexus"
version = "0.1.0"
description = "LangChain tools for the Agent Nexus registry: discover and inspect callable APIs, MCP servers and CLIs at runtime."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Agent Nexus", email = "hello@agentnexus.app" }]
keywords = ["langchain", "agents", "tools", "mcp", "api", "registry", "discovery"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "langchain-core>=0.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://agentnexus.app"
Documentation = "https://agentnexus.app/docs"
Source = "https://github.com/agentnexus/langchain-agent-nexus"

[tool.hatch.build.targets.wheel]
packages = ["langchain_agent_nexus"]
