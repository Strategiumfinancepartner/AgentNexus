[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-agent-nexus"
version = "0.1.0"
description = "LlamaIndex tool spec that lets agents discover APIs, MCP servers and CLIs through the Agent Nexus registry"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Agent Nexus", email = "hello@agentnexus.app" }]
keywords = ["llama-index", "llamaindex", "agents", "tools", "mcp", "api", "registry", "discovery"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "llama-index-core>=0.11.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://agentnexus.app"
Documentation = "https://agentnexus.app/docs"
Source = "https://github.com/Strategiumfinancepartner/llama-index-tools-agent-nexus"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]
