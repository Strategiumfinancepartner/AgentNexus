[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-agent-nexus"
version = "0.1.0"
description = "CrewAI tools that let agents discover APIs, MCP servers and CLIs through the Agent Nexus registry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agent Nexus", email = "hello@agentnexus.app" }]
keywords = ["crewai", "agents", "tools", "mcp", "api", "registry", "discovery"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "crewai>=0.60.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://agentnexus.app"
Documentation = "https://agentnexus.app/docs"
Source = "https://github.com/Strategiumfinancepartner/crewai-agent-nexus"

[tool.hatch.build.targets.wheel]
packages = ["crewai_agent_nexus"]
